<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090909" />
  <title>RiffVault</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--accent:#e32727;--accent2:#7a0c0c;--bg:#070707;--panel:#111;--panel2:#181818;--text:#f5f5f5;--muted:#9a9a9a;--line:#292929;--danger:#ff5d5d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
    button,input,select{font:inherit} button{cursor:pointer}.app{max-width:880px;margin:auto;padding:18px 16px 110px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}

.logo{
    width:38px;
    height:38px;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandText{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logoText{
    height:28px;
    width:auto;
    display:block;
}
#splash{

    position:fixed;
    inset:0;

    background:#000;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    z-index:99999;

    transition:opacity .6s ease;

}

.splashLogo{

    width:120px;

    opacity:0;

    transform:scale(.75);

    animation:logoAppear .8s ease forwards;

}

.splashWordmark{

    width:220px;

    margin-top:25px;

    opacity:0;

    transform:translateY(15px);

    animation:textAppear .6s ease .45s forwards;

}

.splashText{

    color:#888;

    font-size:15px;

    margin-top:10px;

    letter-spacing:.08em;

    opacity:0;

    animation:textAppear .6s ease .8s forwards;

}

@keyframes logoAppear{

    from{

        opacity:0;

        transform:scale(.75);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

@keyframes textAppear{

    from{

        opacity:0;

        transform:translateY(12px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

    h1{font-size:20px;margin:0}.small{font-size:12px;color:var(--muted)}
    .iconbtn,.primary,.ghost,.danger{border:0;border-radius:11px;padding:10px 13px;color:var(--text)}.iconbtn,.ghost{background:var(--panel2)}.primary{background:var(--accent);font-weight:700}.danger{background:#3b1414;color:#ff9b9b}
    .search{position:relative;margin-bottom:15px}.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:13px 42px 13px 14px;outline:none}.search input:focus{border-color:var(--accent)}.search span{position:absolute;right:14px;top:12px;color:var(--muted)}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.breadcrumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);margin:8px 0 16px}.breadcrumb button{border:0;background:none;color:var(--text);padding:0}.breadcrumb button:last-child{color:var(--accent);font-weight:700}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}.sectionTitle h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
    .list{display:grid;gap:8px}.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}.row:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}.rowMain{flex:1;min-width:0}.rowTitle{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowMeta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:color-mix(in srgb,var(--accent) 18%,var(--panel2));color:var(--accent);padding:4px 8px;border-radius:99px;font-size:11px}.thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#222}.folderIcon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,var(--panel2));font-size:22px}.rowActions{display:flex;gap:6px}.mini{border:0;background:var(--panel2);color:var(--text);border-radius:9px;padding:8px}
    .empty{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
    dialog{width:min(520px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);padding:0;box-shadow:0 25px 80px #000}dialog::backdrop{background:#000b}.modal{padding:18px}.modal h3{margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px;outline:none}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .player{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(880px,100%);background:#0d0d0df2;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}.playerTop{display:flex;align-items:center;gap:10px}.playerInfo{flex:1;min-width:0}.playerControls{display:flex;gap:7px}.player button{border:0;background:var(--panel2);color:var(--text);border-radius:10px;width:38px;height:38px}.player button.main{background:var(--accent)}.videoStage{width:100%;aspect-ratio:16/9;min-height:200px;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}.videoStage iframe{width:100%!important;height:100%!important;display:block}#ytPlayer{width:100%;height:100%}.player.collapsed .videoStage{display:none}.playerToggle{border:0;background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 10px;margin-left:auto}
    .tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 12px;border-radius:99px}.tab.active{background:var(--accent);border-color:var(--accent);color:white}
    .settingsGrid{display:grid;gap:12px}.settingCard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.skinOptions{display:flex;gap:10px;flex-wrap:wrap}.skin{width:66px;height:48px;border:2px solid transparent;border-radius:12px;background:linear-gradient(135deg,#070707 58%,var(--swatch) 59%)}.skin.active{border-color:white}
    @media(max-width:560px){.rowActions .hideMobile{display:none}.app{padding-inline:12px;opacity:0:transition:opacity .6s}.logo{width:35px;height:35px}.playerInfo .rowMeta{max-width:170px}}
  </style>
</head>
<body>
<div id="splash">

    <img src="icons/icon-512.png" class="splashLogo">

    <img src="icons/logo.png" class="splashWordmark">

    <div class="splashText">
        Tu biblioteca, tu orden.
    </div>

</div>

<div class="app">
  <header>
<div class="brand">
    <div class="logo">
        <img src="icons/icon-512.png" alt="RiffVault">
    </div>

    <div class="brandText">
        <img src="icons/logo.png" alt="RiffVault" class="logoText">
        <div class="small">Tu biblioteca, tu orden</div>
    </div>
</div>
<button class="iconbtn" id="settingsBtn" aria-label="Configuración">⚙</button></header>
  <div class="tabs"><button class="tab active" data-view="library">Biblioteca</button><button class="tab" data-view="inbox">Por organizar <span id="inboxCount"></span></button></div>
  <div class="search"><input id="searchInput" placeholder="Buscar en la biblioteca..." autocomplete="off"><span>⌕</span></div>
  <div id="libraryView">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="toolbar"><button class="primary" id="addFolderBtn">＋ Nueva carpeta</button><button class="ghost" id="addSongBtn">＋ Agregar canción</button></div>
    <div class="sectionTitle"><h2>Carpetas</h2></div><div class="list" id="folderList"></div>
    <div class="sectionTitle"><h2>Canciones</h2><span class="small" id="songCount"></span></div><div class="list" id="songList"></div>
  </div>
  <div id="settingsView" hidden>
    <div class="breadcrumb"><button id="backSettings">← Biblioteca</button><span>›</span><button>Configuración</button></div>
    <div class="settingsGrid">
      <div class="settingCard"><b>Skin</b><p class="small">Puedes cambiarla cuando quieras.</p><div class="skinOptions"><button class="skin" data-skin="red" style="--swatch:#e32727" title="Negro y rojo"></button><button class="skin" data-skin="blue" style="--swatch:#2584ff" title="Negro y azul"></button><button class="skin" data-skin="gray" style="--swatch:#858585" title="Negro y gris"></button></div></div>
      <div class="settingCard"><b>Al terminar una carpeta</b><div class="field"><select id="endMode"><option value="next">Continuar con la siguiente carpeta</option><option value="repeat">Repetir carpeta actual</option></select></div></div>
      <div class="settingCard"><b>Datos</b><p class="small">Todo se guarda localmente en este dispositivo.</p><button class="danger" id="resetBtn">Borrar biblioteca de prueba</button></div>
    </div>
  </div>
</div>
<div class="player collapsed" id="playerBar" hidden><div class="videoStage"><div id="ytPlayer"></div></div><div class="playerTop"><img class="thumb" id="playerThumb"><div class="playerInfo"><div class="rowTitle" id="playerTitle">Sin reproducción</div><div class="rowMeta" id="playerMeta"></div></div><button class="playerToggle" id="playerToggle" title="Mostrar u ocultar video">▴</button><div class="playerControls"><button id="prevBtn">⏮</button><button class="main" id="playBtn">▶</button><button id="nextBtn">⏭</button></div></div></div>

<dialog id="folderDialog"><form class="modal" method="dialog"><h3>Nueva carpeta</h3><div class="field"><label>Nombre</label><input id="folderName" required maxlength="60" placeholder="Ej. Metalcore"></div><div class="modalActions"><button class="ghost" value="cancel">Cancelar</button><button class="primary" id="saveFolderBtn" value="default">Crear</button></div></form></dialog>
<dialog id="songDialog"><form class="modal" method="dialog"><h3>Agregar canción</h3><div class="field"><label>Enlace de YouTube</label><input id="songUrl" required placeholder="https://youtu.be/..."></div><div class="field"><label>Título (opcional)</label><input id="songTitle" placeholder="Se intentará obtener automáticamente"></div><div class="field"><label>Artista / canal (opcional)</label><input id="songArtist"></div><div class="field"><label>Guardar en</label><select id="songDestination"></select></div><div class="modalActions"><button class="ghost" value="cancel">Cancelar</button><button class="primary" id="saveSongBtn" value="default">Guardar</button></div></form></dialog>
<script>
const SKINS={red:{accent:'#e32727',accent2:'#7a0c0c'},blue:{accent:'#2584ff',accent2:'#103d80'},gray:{accent:'#929292',accent2:'#444'}};
const seed={folders:[{id:'metal',name:'Metal',parentId:null,order:0},{id:'atmosphere',name:'Atmósfera',parentId:null,order:1},{id:'rock',name:'Rock',parentId:null,order:2},{id:'soundtracks',name:'Soundtracks',parentId:null,order:3},{id:'power',name:'Power Metal',parentId:'metal',order:0},{id:'metalcore',name:'Metalcore',parentId:'metal',order:1}],songs:[],settings:{skin:'red',endMode:'next'},currentFolder:null,currentSong:null};
let db=JSON.parse(localStorage.getItem('tma_db')||'null')||structuredClone(seed);let currentFolder=null,currentView='library',queue=[],queueIndex=-1,ytPlayer=null,ytReady=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem('tma_db',JSON.stringify(db));}
function applySkin(){let s=SKINS[db.settings.skin]||SKINS.red;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--accent2',s.accent2);$$('.skin').forEach(x=>x.classList.toggle('active',x.dataset.skin===db.settings.skin));$('#endMode').value=db.settings.endMode;}
function descendants(folderId){let ids=[folderId],i=0;while(i<ids.length){db.folders.filter(f=>f.parentId===ids[i]).forEach(f=>ids.push(f.id));i++;}return ids;}
function folderPath(id){let out=[],f=db.folders.find(x=>x.id===id);while(f){out.unshift(f);f=db.folders.find(x=>x.id===f.parentId)}return out;}
function render(){applySkin();$('#settingsView').hidden=true;$('#libraryView').hidden=false;$('#inboxCount').textContent=db.songs.filter(s=>!s.folderId).length?`(${db.songs.filter(s=>!s.folderId).length})`:'';let q=$('#searchInput').value.trim().toLowerCase();let scope=currentView==='inbox'?[]:(currentFolder?descendants(currentFolder):db.folders.map(f=>f.id));
 let folders=currentView==='inbox'?[]:db.folders.filter(f=>f.parentId===currentFolder).sort((a,b)=>a.order-b.order);let songs=currentView==='inbox'?db.songs.filter(s=>!s.folderId):db.songs.filter(s=>s.folderId===currentFolder);
 if(q){folders=db.folders.filter(f=>(!currentFolder||scope.includes(f.id))&&f.name.toLowerCase().includes(q));songs=db.songs.filter(s=>(currentView==='inbox'?!s.folderId:(!currentFolder||scope.includes(s.folderId)))&&(`${s.title} ${s.artist||''}`).toLowerCase().includes(q));}
 $('#folderList').innerHTML=folders.length?folders.map(f=>`<div class="row"><div class="folderIcon">📁</div><div class="rowMain" onclick="openFolder('${f.id}')"><div class="rowTitle">${esc(f.name)}</div><div class="rowMeta">${db.folders.filter(x=>x.parentId===f.id).length} carpetas · ${db.songs.filter(x=>descendants(f.id).includes(x.folderId)).length} canciones</div></div><div class="rowActions"><button class="mini" onclick="renameFolder('${f.id}')">✎</button><button class="mini hideMobile" onclick="deleteFolder('${f.id}')">🗑</button></div></div>`).join(''):'<div class="empty">No hay carpetas aquí.</div>';
 $('#songList').innerHTML=songs.length?songs.map(s=>songRow(s)).join(''):'<div class="empty">No hay canciones aquí.</div>';$('#songCount').textContent=`${songs.length}`;renderBreadcrumb();populateDestinations();}
function songRow(s){return `<div class="row"><img class="thumb" src="${s.thumbnail}" alt=""><div class="rowMain" onclick="playSong('${s.id}')"><div class="rowTitle">${esc(s.title)}</div><div class="rowMeta">${esc(s.artist||'Artista desconocido')}</div></div><div class="rowActions"><button class="mini" onclick="toggleFavorite('${s.id}')">${s.favorite?'★':'☆'}</button><button class="mini" onclick="moveSongPrompt('${s.id}')">↗</button><button class="mini hideMobile" onclick="deleteSong('${s.id}')">🗑</button></div></div>`}
function renderBreadcrumb(){let items=[{id:null,name:'Biblioteca'},...folderPath(currentFolder)];if(currentView==='inbox')items=[{id:null,name:'Biblioteca'},{id:'inbox',name:'Por organizar'}];$('#breadcrumb').innerHTML=items.map((x,i)=>`${i?'<span>›</span>':''}<button onclick="${x.id==='inbox'?"setView('inbox')":`openFolder(${x.id?`'${x.id}'`:'null'})`}">${esc(x.name)}</button>`).join('');$('#searchInput').placeholder=currentView==='inbox'?'Buscar en Por organizar...':currentFolder?`Buscar en ${folderPath(currentFolder).at(-1).name}...`:'Buscar en la biblioteca...';}
function openFolder(id){currentFolder=id;currentView='library';$('.tab.active')?.classList.remove('active');$('.tab[data-view="library"]').classList.add('active');$('#searchInput').value='';render();}
function setView(v){currentView=v;if(v==='inbox')currentFolder=null;$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));$('#searchInput').value='';render();}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
$('#addFolderBtn').onclick=()=>{$('#folderName').value='';$('#folderDialog').showModal()};$('#saveFolderBtn').onclick=e=>{let n=$('#folderName').value.trim();if(!n){e.preventDefault();return}db.folders.push({id:uid(),name:n,parentId:currentFolder,order:db.folders.filter(f=>f.parentId===currentFolder).length});save();setTimeout(render)};
function renameFolder(id){let f=db.folders.find(x=>x.id===id),n=prompt('Nuevo nombre',f.name);if(n?.trim()){f.name=n.trim();save();render()}}
function deleteFolder(id){let f=db.folders.find(x=>x.id===id);if(!confirm(`Eliminar “${f.name}” y todo su contenido?`))return;let ids=descendants(id);db.folders=db.folders.filter(x=>!ids.includes(x.id));db.songs=db.songs.filter(x=>!ids.includes(x.folderId));save();render()}
$('#addSongBtn').onclick=()=>{$('#songUrl').value='';$('#songTitle').value='';$('#songArtist').value='';populateDestinations();$('#songDialog').showModal()};
function populateDestinations(){let options=['<option value="">Por organizar</option>',...db.folders.map(f=>`<option value="${f.id}" ${f.id===currentFolder?'selected':''}>${esc(folderPath(f.id).map(x=>x.name).join(' › '))}</option>`)];$('#songDestination').innerHTML=options.join('')}
function videoId(url){try{let u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.searchParams.get('v'))return u.searchParams.get('v');let m=u.pathname.match(/\/(shorts|embed)\/([^/?]+)/);return m?.[2]||null}catch{return null}}
$('#saveSongBtn').onclick=async e=>{e.preventDefault();let url=$('#songUrl').value.trim(),vid=videoId(url);if(!vid){alert('Ese enlace no parece ser un video válido de YouTube.');return}let title=$('#songTitle').value.trim(),artist=$('#songArtist').value.trim();if(!title){try{let r=await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v='+vid)}&format=json`);if(r.ok){let meta=await r.json();title=meta.title;artist=meta.author_name}}catch{}}title=title||`Video de YouTube (${vid})`;db.songs.push({id:uid(),videoId:vid,url,title,artist,thumbnail:`https://i.ytimg.com/vi/${vid}/hqdefault.jpg`,folderId:$('#songDestination').value||null,order:Date.now(),favorite:false});save();$('#songDialog').close();render()};
function toggleFavorite(id){let s=db.songs.find(x=>x.id===id);s.favorite=!s.favorite;save();render()}
function deleteSong(id){if(confirm('¿Eliminar esta canción?')){db.songs=db.songs.filter(x=>x.id!==id);save();render()}}
function moveSongPrompt(id){let s=db.songs.find(x=>x.id===id),choices=['0: Por organizar',...db.folders.map((f,i)=>`${i+1}: ${folderPath(f.id).map(x=>x.name).join(' › ')}`)].join('\n');let n=prompt('Escribe el número del destino:\n'+choices);if(n===null)return;let idx=Number(n);if(!Number.isInteger(idx)||idx<0||idx>db.folders.length)return alert('Destino inválido');s.folderId=idx===0?null:db.folders[idx-1].id;save();render()}
function buildQueue(song){let songs=song.folderId?db.songs.filter(x=>x.folderId===song.folderId):db.songs.filter(x=>!x.folderId);queue=songs.sort((a,b)=>a.order-b.order);queueIndex=queue.findIndex(x=>x.id===song.id)}
function playSong(id){let s=db.songs.find(x=>x.id===id);buildQueue(s);db.currentSong=id;save();showPlayer(s);if(ytReady){ytPlayer.loadVideoById(s.videoId);$('#playerBar').classList.remove('collapsed');$('#playerToggle').textContent='▾'}}
function showPlayer(s){$('#playerBar').hidden=false;$('#playerThumb').src=s.thumbnail;$('#playerTitle').textContent=s.title;$('#playerMeta').textContent=s.artist||'Artista desconocido'}
function nextSong(auto=false){if(!queue.length)return;queueIndex++;if(queueIndex>=queue.length){if(db.settings.endMode==='repeat'){queueIndex=0}else{let folder=db.folders.find(f=>f.id===queue[0]?.folderId);if(folder){let siblings=db.folders.filter(f=>f.parentId===folder.parentId).sort((a,b)=>a.order-b.order),start=siblings.findIndex(f=>f.id===folder.id);let next=null;for(let i=1;i<=siblings.length;i++){let cand=siblings[(start+i)%siblings.length],ss=db.songs.filter(x=>x.folderId===cand.id);if(ss.length){next=ss;break}}if(next){queue=next.sort((a,b)=>a.order-b.order);queueIndex=0}else queueIndex=0}else queueIndex=0}}let s=queue[queueIndex];db.currentSong=s.id;save();showPlayer(s);if(ytReady)ytPlayer.loadVideoById(s.videoId)}
function prevSong(){if(!queue.length)return;queueIndex=(queueIndex-1+queue.length)%queue.length;let s=queue[queueIndex];showPlayer(s);if(ytReady)ytPlayer.loadVideoById(s.videoId)}
$('#nextBtn').onclick=()=>nextSong();$('#prevBtn').onclick=prevSong;$('#playerToggle').onclick=()=>{let p=$('#playerBar');p.classList.toggle('collapsed');$('#playerToggle').textContent=p.classList.contains('collapsed')?'▴':'▾'};$('#playBtn').onclick=()=>{if(!ytPlayer)return;let st=ytPlayer.getPlayerState();st===1?ytPlayer.pauseVideo():ytPlayer.playVideo()};
window.onYouTubeIframeAPIReady=()=>{ytPlayer=new YT.Player('ytPlayer',{height:'360',width:'640',videoId:'',playerVars:{playsinline:1,controls:1,rel:0},events:{onReady:()=>{ytReady=true;if(db.currentSong){let s=db.songs.find(x=>x.id===db.currentSong);if(s){buildQueue(s);showPlayer(s)}}},onStateChange:e=>{if(e.data===0)nextSong(true);$('#playBtn').textContent=e.data===1?'Ⅱ':'▶'}}})};let yt=document.createElement('script');yt.src='https://www.youtube.com/iframe_api';document.head.appendChild(yt);
$('#searchInput').oninput=render;$$('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));$('#settingsBtn').onclick=()=>{$('#libraryView').hidden=true;$('#settingsView').hidden=false};$('#backSettings').onclick=render;$$('.skin').forEach(b=>b.onclick=()=>{db.settings.skin=b.dataset.skin;save();applySkin()});$('#endMode').onchange=e=>{db.settings.endMode=e.target.value;save()};$('#resetBtn').onclick=()=>{if(confirm('¿Borrar todos los datos de prueba?')){db=structuredClone(seed);save();currentFolder=null;render()}};
window.addEventListener('DOMContentLoaded',()=>{let p=new URLSearchParams(location.search),shared=p.get('url')||p.get('text');if(shared){$('#songUrl').value=shared;$('#songDialog').showModal()}render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');

window.addEventListener("load", () => {

    setTimeout(() => {

        document.getElementById("splash").style.opacity = "0";

        document.querySelector(".app").style.opacity = "1";

        setTimeout(() => {

            document.getElementById("splash").remove();

        }, 600);

    }, 1800);

});

</script>
</body>
</html>
